<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2c4d"/>
      <stop offset="100%" stop-color="#0e1730"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1c2c4d" stroke-width="1" opacity="0.5">
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200"/>
    <path d="M 120 0 V 300 M 240 0 V 300 M 360 0 V 300 M 480 0 V 300 M 600 0 V 300 M 720 0 V 300 M 840 0 V 300 M 960 0 V 300 M 1080 0 V 300"/>
  </g>

  <!-- corner accents -->
  <path d="M 0 0 H 26 V 26" stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 1200 0 H 1174 V 26" stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- ESP32 chip graphic -->
  <g filter="url(#soft)">
    <rect x="872" y="76" width="128" height="128" rx="14" fill="url(#chipg)" stroke="#2b4a7a" stroke-width="2"/>
    <rect x="912" y="106" width="48" height="24" rx="4" fill="none" stroke="#00e5ff" stroke-width="1.6" opacity="0.9"/>
    <text x="936" y="121" text-anchor="middle" fill="#00e5ff" font-size="9" font-family="monospace" font-weight="700">ESP32</text>
    <!-- pins -->
    <g stroke="#3d5a92" stroke-width="2">
      <line x1="886" y1="96" x2="872" y2="96"/><line x1="886" y1="116" x2="872" y2="116"/>
      <line x1="886" y1="136" x2="872" y2="136"/><line x1="886" y1="156" x2="872" y2="156"/>
      <line x1="886" y1="176" x2="872" y2="176"/><line x1="886" y1="196" x2="872" y2="196"/>
      <line x1="986" y1="96" x2="1000" y2="96"/><line x1="986" y1="116" x2="1000" y2="116"/>
      <line x1="986" y1="136" x2="1000" y2="136"/><line x1="986" y1="156" x2="1000" y2="156"/>
      <line x1="986" y1="176" x2="1000" y2="176"/><line x1="986" y1="196" x2="1000" y2="196"/>
      <line x1="886" y1="86" x2="886" y2="72"/><line x1="906" y1="86" x2="906" y2="72"/>
      <line x1="926" y1="86" x2="926" y2="72"/><line x1="946" y1="86" x2="946" y2="72"/>
      <line x1="966" y1="86" x2="966" y2="72"/><line x1="986" y1="86" x2="986" y2="72"/>
      <line x1="886" y1="186" x2="886" y2="200"/><line x1="906" y1="186" x2="906" y2="200"/>
      <line x1="926" y1="186" x2="926" y2="200"/><line x1="946" y1="186" x2="946" y2="200"/>
      <line x1="966" y1="186" x2="966" y2="200"/><line x1="986" y1="186" x2="986" y2="200"/>
    </g>
    <text x="936" y="176" text-anchor="middle" fill="#5a78ad" font-size="8" font-family="monospace">Xtensa LX6</text>
  </g>

  <!-- INA226 chip -->
  <g filter="url(#soft)">
    <rect x="1100" y="176" width="72" height="72" rx="10" fill="url(#chipg)" stroke="#2b4a7a" stroke-width="2"/>
    <text x="1136" y="208" text-anchor="middle" fill="#7c5cff" font-size="9" font-family="monospace" font-weight="700">INA226</text>
    <text x="1136" y="224" text-anchor="middle" fill="#5a78ad" font-size="7" font-family="monospace">±0.1% · 16-bit</text>
    <g stroke="#3d5a92" stroke-width="1.6">
      <line x1="1112" y1="190" x2="1100" y2="190"/><line x1="1112" y1="210" x2="1100" y2="210"/>
      <line x1="1112" y1="234" x2="1100" y2="234"/><line x1="1112" y1="218" x2="1100" y2="218"/>
      <line x1="1160" y1="190" x2="1172" y2="190"/><line x1="1160" y1="210" x2="1172" y2="210"/>
      <line x1="1160" y1="234" x2="1172" y2="234"/>
    </g>
  </g>

  <!-- waveform -->
  <g filter="url(#glow)">
    <path d="M 45 210 L 105 210 L 132 150 L 159 234 L 186 120 L 213 240 L 240 168 L 267 174 L 294 96 L 321 246 L 348 204 L 375 180 L 402 132 L 429 228 L 456 156 L 483 192 L 510 120 L 537 240 L 564 144 L 591 210 L 618 168 L 645 186 L 672 102 L 699 246 L 726 204 L 753 150 L 780 234 L 807 180 L 834 120 L 861 222"
          stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 45 252 L 120 252 L 147 246 L 174 258 L 201 240 L 228 258 L 255 246 L 282 252 L 309 240 L 336 258 L 363 246 L 390 258 L 417 240 L 444 258 L 471 246 L 498 252 L 525 240 L 552 258 L 579 246 L 606 258 L 633 240 L 660 258 L 687 246 L 714 252 L 741 240 L 768 258 L 795 246 L 822 258 L 849 252"
          stroke="#2b4a7a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="45" y="120" fill="#fff" font-size="44" font-weight="800" letter-spacing="1">Power
    <tspan fill="url(#accent)"> Profiler</tspan>
  </text>
  <text x="47" y="150" fill="#8aa3c9" font-size="16" letter-spacing="0.5">Real-time energy profiling for battery-powered electronics · ESP32 + INA226</text>

  <!-- badges-ish pills -->
  <g font-size="11" font-weight="600" letter-spacing="1">
    <rect x="47" y="168" width="116" height="24" rx="12" fill="#11203c" stroke="#2b4a7a"/>
    <circle cx="63" cy="180" r="3.5" fill="#69f0ae"/>
    <text x="74" y="184" fill="#9fc0ea">50 Hz</text>

    <rect x="175" y="168" width="128" height="24" rx="12" fill="#11203c" stroke="#2b4a7a"/>
    <circle cx="191" cy="180" r="3.5" fill="#00e5ff"/>
    <text x="202" y="184" fill="#9fc0ea">16-bit · I²C</text>

    <rect x="315" y="168" width="120" height="24" rx="12" fill="#11203c" stroke="#2b4a7a"/>
    <circle cx="331" cy="180" r="3.5" fill="#ff4081"/>
    <text x="342" y="184" fill="#9fc0ea">CSV + Web</text>

    <rect x="447" y="168" width="132" height="24" rx="12" fill="#11203c" stroke="#2b4a7a"/>
    <circle cx="463" cy="180" r="3.5" fill="#ffd740"/>
    <text x="474" y="184" fill="#9fc0ea">Energy (mWh)</text>
  </g>

  <!-- live chip readout card -->
  <g filter="url(#soft)">
    <rect x="47" y="212" width="392" height="58" rx="10" fill="#0d1630" stroke="#2b4a7a" stroke-width="1.5"/>
    <text x="65" y="236" fill="#5a78ad" font-size="9" font-family="monospace" letter-spacing="1">LIVE SAMPLES</text>
    <text x="65" y="256" fill="#00e5ff" font-family="monospace" font-size="12">V 3.682</text>
    <text x="152" y="256" fill="#ff4081" font-family="monospace" font-size="12">mA 8.37</text>
    <text x="248" y="256" fill="#ffd740" font-family="monospace" font-size="12">mW 41.7</text>
    <text x="330" y="256" fill="#69f0ae" font-family="monospace" font-size="12">mWh 0.05</text>
  </g>
</svg>
