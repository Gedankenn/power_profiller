<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e63946"/><stop offset="100%" stop-color="#c1121f"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a9d8f"/><stop offset="100%" stop-color="#1b6b60"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e9c46a"/><stop offset="100%" stop-color="#d4a73a"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#264653"/><stop offset="100%" stop-color="#1a323b"/></linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="#666"/></marker>
    <style>text{dominant-baseline:middle}</style>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111">System Architecture</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#888">Signal flow from sensors to analysis</text>

  <rect x="15" y="65" width="155" height="120" rx="12" fill="url(#g1)" filter="url(#sh)"/>
  <text x="92" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">INA226</text>
  <text x="92" y="132" text-anchor="middle" fill="#ffd4d9" font-size="11">Shunt V · Bus V</text>
  <text x="92" y="150" text-anchor="middle" fill="#ffd4d9" font-size="11">Current · Power</text>

  <rect x="235" y="65" width="155" height="120" rx="12" fill="url(#g2)" filter="url(#sh)"/>
  <text x="312" y="110" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">ESP32</text>
  <text x="312" y="132" text-anchor="middle" fill="#d9f2ee" font-size="11">I²C · ADC</text>
  <text x="312" y="152" text-anchor="middle" fill="#d9f2ee" font-size="11">WiFi · HTTP Server</text>

  <rect x="455" y="65" width="155" height="120" rx="12" fill="url(#g3)" filter="url(#sh)"/>
  <text x="532" y="112" text-anchor="middle" fill="#333" font-size="14" font-weight="700">CSV Serial</text>
  <text x="532" y="132" text-anchor="middle" fill="#5a4a1a" font-size="11">10 samples/s</text>
  <text x="532" y="152" text-anchor="middle" fill="#5a4a1a" font-size="11">timestamp,V,mA,mW</text>

  <rect x="675" y="65" width="130" height="120" rx="12" fill="url(#g4)" filter="url(#sh)"/>
  <text x="740" y="112" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">PC / Browser</text>
  <text x="740" y="134" text-anchor="middle" fill="#ced4da" font-size="11">Chart.js</text>
  <text x="740" y="154" text-anchor="middle" fill="#ced4da" font-size="11">Dashboard</text>

  <line x1="175" y1="125" x2="229" y2="125" stroke="#666" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="202" y="112" text-anchor="middle" font-size="11" fill="#e63946" font-weight="600">I²C bus</text>

  <line x1="395" y1="125" x2="449" y2="125" stroke="#666" stroke-width="2.5" marker-end="url(#ar)"/>

  <line x1="615" y1="125" x2="669" y2="125" stroke="#666" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="642" y="112" text-anchor="middle" font-size="11" fill="#666" font-weight="600">HTTP</text>

