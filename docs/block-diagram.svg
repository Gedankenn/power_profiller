<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bkg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="sh" x="-8%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9z" fill="#94a3b8"/>
    </marker>
    <style>text{dominant-baseline:middle}</style>
  </defs>

  <rect width="960" height="300" rx="18" fill="url(#bkg)"/>
  <rect x="1" y="1" width="958" height="298" rx="17" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="480" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">System Architecture</text>
  <text x="480" y="55" text-anchor="middle" font-size="10.5" fill="#64748b">From power rail to actionable insights — entirely on-device</text>

  <!-- DUT / power source -->
  <rect x="30" y="92" width="150" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="92" width="150" height="36" rx="14" fill="#f1f5f9"/>
  <rect x="30" y="112" width="150" height="16" fill="#f1f5f9"/>
  <text x="105" y="110" text-anchor="middle" fill="#475569" font-size="11" font-weight="700">DUT</text>
  <text x="105" y="150" text-anchor="middle" fill="#0ea5e9" font-size="12" font-weight="700">Power Rail</text>
  <text x="105" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">0–36 V · 0–800 mA</text>
  <text x="105" y="192" text-anchor="middle" fill="#94a3b8" font-size="10">Battery · USB · PSU</text>

  <!-- INA226 -->
  <rect x="250" y="92" width="150" height="130" rx="14" fill="url(#g1)" filter="url(#sh)"/>
  <text x="325" y="136" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">INA226</text>
  <text x="325" y="158" text-anchor="middle" fill="#ddd6fe" font-size="10">0.1 Ω shunt · 16-bit</text>
  <text x="325" y="174" text-anchor="middle" fill="#ddd6fe" font-size="10">V · A · W · Wh</text>
  <text x="325" y="192" text-anchor="middle" fill="#ddd6fe" font-size="9">±0.1% accuracy</text>

  <!-- ESP32 -->
  <rect x="470" y="92" width="150" height="130" rx="14" fill="url(#g2)" filter="url(#sh)"/>
  <text x="545" y="132" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">ESP32</text>
  <text x="545" y="156" text-anchor="middle" fill="#bfdbfe" font-size="10">FreeRTOS task</text>
  <text x="545" y="172" text-anchor="middle" fill="#bfdbfe" font-size="10">WiFi · HTTP server</text>
  <text x="545" y="190" text-anchor="middle" fill="#bfdbfe" font-size="9">10 samples/s</text>

  <!-- Serial CSV -->
  <rect x="690" y="74" width="235" height="70" rx="12" fill="url(#g3)" filter="url(#sh)"/>
  <text x="807" y="103" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Serial CSV</text>
  <text x="807" y="122" text-anchor="middle" fill="#ccfbf1" font-size="9" font-family="monospace">timestamp,V,mA,mW</text>

  <!-- Web dashboard -->
  <rect x="690" y="164" width="235" height="70" rx="12" fill="url(#g4)" filter="url(#sh)"/>
  <text x="807" y="193" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Web Dashboard</text>
  <text x="807" y="212" text-anchor="middle" fill="#94a3b8" font-size="9">Chart.js · port 80 · live</text>

  <!-- arrows -->
  <line x1="180" y1="157" x2="245" y2="157" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="212" y="146" text-anchor="middle" font-size="9.5" fill="#6d28d9" font-weight="600">shunt tap</text>

  <line x1="400" y1="157" x2="465" y2="157" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="432" y="146" text-anchor="middle" font-size="9.5" fill="#1d4ed8" font-weight="600">I²C bus</text>

  <line x1="620" y1="109" x2="685" y2="109" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="652" y="98" text-anchor="middle" font-size="9.5" fill="#0f766e" font-weight="600">UART</text>

  <line x1="620" y1="199" x2="685" y2="199" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="652" y="188" text-anchor="middle" font-size="9.5" fill="#334155" font-weight="600">WiFi / HTTP</text>
</svg>
