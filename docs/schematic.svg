<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="Inter, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      text { dominant-baseline: middle; }
      .label { font-size: 13px; fill: #333; }
      .small { font-size: 11px; fill: #555; }
      .title { font-size: 16px; font-weight: bold; fill: #111; }
      .chip-label { font-size: 13px; font-weight: bold; fill: #fff; }
      .pin-label { font-size: 10px; fill: #333; }
      .wire { stroke: #444; stroke-width: 2; fill: none; }
      .wire-vbus { stroke: #d63384; stroke-width: 2.5; fill: none; }
      .wire-gnd { stroke: #555; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .wire-div { stroke: #0d6efd; stroke-width: 2.5; fill: none; }
      .wire-i2c { stroke: #fd7e14; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Power Profiler — Circuit Schematic</text>

  <!-- ========== V_TARGET TOP RAIL ========== -->
  <text x="30" y="90" class="label" font-weight="bold">V_target</text>
  <text x="30" y="108" class="small">(0–5 V)</text>

  <line x1="75" y1="95" x2="220" y2="95" class="wire-vbus"/>
  <circle cx="220" cy="95" r="3" fill="#444"/>

  <!-- ========== VOLTAGE DIVIDER ========== -->
  <path d="M 220 95 H 280" class="wire-div"/>
  <!-- R1 -->
  <rect x="280" y="78" width="16" height="34" rx="2" fill="none" stroke="#0d6efd" stroke-width="2"/>
  <path d="M 273 85 v 20 h 7 M 296 85 v 20 h 7" stroke="#0d6efd" stroke-width="2" fill="none"/>
  <text x="288" y="70" text-anchor="middle" class="small" fill="#0d6efd">10 kΩ</text>

  <circle cx="310" cy="95" r="3" fill="#444"/>
  <path d="M 310 95 H 350" class="wire-div"/>

  <!-- ADC tap label -->
  <text x="350" y="95" text-anchor="start" class="label" font-family="monospace" font-size="12" fill="#0d6efd">GPIO34 (ADC)</text>

  <path d="M 310 95 v 20" class="wire-div"/>
  <!-- R2 -->
  <rect x="294" y="115" width="16" height="34" rx="2" fill="none" stroke="#0d6efd" stroke-width="2"/>
  <path d="M 287 122 v 20 h 7 M 310 122 v 20 h 7" stroke="#0d6efd" stroke-width="2" fill="none"/>
  <text x="302" y="162" text-anchor="middle" class="small" fill="#0d6efd">10 kΩ</text>

  <!-- GND symbol -->
  <path d="M 302 149 l 16 0 M 294 155 l 32 0 M 298 161 l 24 0" stroke="#444" stroke-width="1.5" fill="none"/>
  <text x="318" y="165" class="small" fill="#555">GND</text>

  <!-- ========== MAIN POWER PATH ========== -->
  <path d="M 220 95 V 190 H 280" class="wire-vbus"/>
  <circle cx="280" cy="190" r="3" fill="#444"/>

  <!-- VBUS sense to INA226 -->
  <path d="M 280 190 v 80" class="wire-vbus"/>

  <!-- ========== INA226 CHIP ========== -->
  <rect x="220" y="270" width="120" height="80" rx="6" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
  <text x="280" y="310" text-anchor="middle" class="chip-label">INA226</text>

  <!-- Left pins -->
  <line x1="220" y1="282" x2="240" y2="282" stroke="#ccc" stroke-width="1.5"/>
  <text x="215" y="282" text-anchor="end" class="pin-label">VBUS</text>
  <line x1="220" y1="300" x2="240" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <text x="215" y="300" text-anchor="end" class="pin-label">GND</text>
  <line x1="220" y1="318" x2="240" y2="318" stroke="#ccc" stroke-width="1.5"/>
  <text x="215" y="318" text-anchor="end" class="pin-label">SDA</text>
  <line x1="220" y1="336" x2="240" y2="336" stroke="#ccc" stroke-width="1.5"/>
  <text x="215" y="336" text-anchor="end" class="pin-label">SCL</text>

  <!-- Right pins -->
  <line x1="340" y1="282" x2="360" y2="282" stroke="#ccc" stroke-width="1.5"/>
  <text x="365" y="282" text-anchor="start" class="pin-label">VIN-</text>
  <line x1="340" y1="300" x2="360" y2="300" stroke="#ccc" stroke-width="1.5"/>
  <text x="365" y="300" text-anchor="start" class="pin-label">VIN+</text>

  <!-- VBUS wire connection -->
  <path d="M 280 270 v -15" class="wire-vbus"/>

  <!-- ========== SHUNT RESISTOR ========== -->
  <!-- Path: from tap at (280,190) through shunt -->
  <path d="M 280 190 H 430" class="wire-vbus"/>
  <circle cx="430" cy="190" r="3" fill="#444"/>

  <!-- Shunt resistor inline -->
  <rect x="400" y="180" width="14" height="20" rx="2" fill="#fff" stroke="#d63384" stroke-width="2"/>
  <text x="407" y="210" text-anchor="middle" class="small" fill="#d63384">0.1 Ω</text>
  <text x="407" y="222" text-anchor="middle" class="small" fill="#d63384">shunt</text>

  <!-- INA226 VIN+/VIN- connections to shunt -->
  <path d="M 430 190 v 110" class="wire-vbus"/> <!-- to VIN+ -->
  <path d="M 400 190 v 92" class="wire"/>       <!-- to VIN- (before shunt) -->

  <!-- ========== LOAD PATH ========== -->
  <path d="M 430 190 H 520" class="wire-vbus"/>

  <!-- Load block -->
  <rect x="520" y="165" width="90" height="50" rx="8" fill="#0f3460" stroke="#333" stroke-width="2"/>
  <text x="565" y="183" text-anchor="middle" class="chip-label" font-size="12">LOAD</text>
  <text x="565" y="200" text-anchor="middle" fill="#aaa" font-size="10">(DUT)</text>

  <!-- Load bottom path -->
  <path d="M 565 215 v 95" class="wire"/>
  <path d="M 520 310 h 90" class="wire-gnd"/>
  <path d="M 565 310 v 30" class="wire"/>

  <!-- GND for load -->
  <path d="M 565 340 l 20 0 M 555 348 l 40 0 M 560 356 l 30 0" stroke="#444" stroke-width="1.5" fill="none"/>
  <text x="590" y="350" class="small" fill="#555">GND</text>

  <!-- ========== INA226 GND ========== -->
  <path d="M 280 350 v 30" class="wire-gnd"/>
  <path d="M 280 380 l 20 0 M 270 388 l 40 0 M 275 396 l 30 0" stroke="#555" stroke-width="1" fill="none"/>

  <!-- ========== LEGEND ========== -->
  <rect x="560" y="400" width="220" height="130" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="575" y="420" class="label" font-weight="bold">Legend</text>
  <line x1="575" y1="438" x2="605" y2="438" class="wire-vbus"/>
  <text x="612" y="438" class="small">V_target / bus voltage</text>
  <line x1="575" y1="458" x2="605" y2="458" class="wire-div"/>
  <text x="612" y="458" class="small">Divider / ADC sense line</text>
  <line x1="575" y1="478" x2="605" y2="478" class="wire-i2c"/>
  <text x="612" y="478" class="small">I²C bus (SDA/SCL to ESP32)</text>
  <line x1="575" y1="498" x2="605" y2="498" class="wire-gnd"/>
  <text x="612" y="498" class="small">Ground</text>

  <!-- I2C labels -->
  <text x="200" y="318" text-anchor="end" class="small" fill="#fd7e14" font-family="monospace">GPIO21</text>
  <text x="200" y="336" text-anchor="end" class="small" fill="#fd7e14" font-family="monospace">GPIO22</text>

</svg>
